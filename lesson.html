<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>AGULIBRARY — Lesson</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#171918;
  color:#edf8f3;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 5%;

  background:#202120;
  border-bottom:1px solid #46504b;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;

  color:#fff;
  text-decoration:none;
}

.brand-mark{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;

  border-radius:17px;

  background:#087a4b;

  font-size:20px;
  font-weight:900;
}

.brand-title{
  font-size:20px;
  font-weight:900;
}

.brand-subtitle{
  display:block;

  margin-top:3px;

  color:#8fa09a;

  font-size:9px;

  letter-spacing:2px;
}

.back-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:11px 16px;

  border-radius:12px;

  background:#087a4b;

  color:#fff;

  text-decoration:none;

  font-weight:800;
}

/* =========================
   MAIN
========================= */

main{
  width:min(1000px,92%);

  margin:auto;

  padding:30px 0 80px;
}

/* =========================
   STATUS
========================= */

.status{
  display:none;

  padding:14px 18px;

  margin-bottom:18px;

  border-radius:13px;

  font-weight:800;
}

.status.show{
  display:block;
}

.status.success{
  background:#063b24;
  color:#70e7bc;
}

.status.error{
  background:#421d1d;
  color:#ff9b9b;
}

/* =========================
   LESSON HERO
========================= */

.lesson-hero{
  padding:35px;

  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      #003d17,
      #087a4b
    );

  border:1px solid #176b40;

  margin-bottom:20px;
}

.eyebrow{
  color:#70e7bc;

  font-size:11px;

  font-weight:900;

  letter-spacing:3px;
}

.lesson-hero h1{
  margin:15px 0;

  font-size:
    clamp(34px,7vw,58px);

  line-height:1.05;

  color:#fff;
}

.lesson-hero p{
  margin:0;

  max-width:780px;

  color:#c8ded5;

  font-size:17px;

  line-height:1.7;
}

.meta{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:22px;
}

.meta span{
  padding:8px 12px;

  border-radius:20px;

  background:rgba(255,255,255,.10);

  color:#e7fff5;

  font-size:12px;

  font-weight:800;
}

/* =========================
   PROGRESS
========================= */

.progress-card{
  padding:23px;

  margin-bottom:20px;

  background:#202120;

  border:1px solid #4b5550;

  border-radius:22px;
}

.progress-top{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}

.progress-top span{
  color:#a9b7b1;

  font-size:13px;

  font-weight:900;
}

.progress-top strong{
  color:#70e7bc;

  font-size:21px;
}

.progress-track{
  width:100%;

  height:14px;

  margin-top:12px;

  overflow:hidden;

  background:#10271d;

  border-radius:50px;
}

.progress-fill{
  width:0;

  height:100%;

  background:#087a4b;

  border-radius:50px;

  transition:
    width .4s ease;
}

/* =========================
   CONTENT
========================= */

.lesson-content{
  min-height:400px;

  padding:
    clamp(24px,5vw,48px);

  margin-bottom:20px;

  background:#202120;

  border:1px solid #4b5550;

  border-radius:27px;
}

.lesson-content h2{
  margin-top:0;

  color:#70e7bc;

  font-size:30px;
}

.lesson-content h3{
  margin-top:30px;

  color:#f0f8f5;

  font-size:23px;
}

.lesson-content p{
  color:#c7d4ce;

  font-size:17px;

  line-height:1.9;
}

.lesson-content ul,
.lesson-content ol{
  color:#c7d4ce;

  line-height:1.9;
}

.lesson-content li{
  margin-bottom:8px;
}

.lesson-content img,
.lesson-content video,
.lesson-content iframe{
  display:block;

  max-width:100%;

  margin:20px auto;

  border-radius:15px;
}

.lesson-content a{
  color:#70e7bc;
}

.lesson-content blockquote{
  margin:25px 0;

  padding:18px;

  background:#18221e;

  border-left:4px solid #087a4b;

  border-radius:10px;

  color:#c8d8d1;
}

/* =========================
   FILE
========================= */

.file-card{
  margin-top:25px;

  padding:22px;

  border-radius:17px;

  background:#18221e;

  border:1px solid #365044;
}

.file-button{
  display:inline-block;

  margin-top:12px;

  padding:12px 18px;

  border-radius:11px;

  background:#087a4b;

  color:#fff;

  text-decoration:none;

  font-weight:900;
}

/* =========================
   COMPLETE
========================= */

.complete-card{
  padding:30px;

  margin-bottom:20px;

  text-align:center;

  background:#202120;

  border:1px solid #4b5550;

  border-radius:24px;
}

.complete-card h2{
  margin-top:0;

  font-size:26px;
}

.complete-card p{
  color:#a9b7b1;

  line-height:1.7;
}

.complete-button{
  border:0;

  padding:15px 25px;

  border-radius:13px;

  background:#087a4b;

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;
}

.complete-button:hover{
  background:#09935b;
}

.complete-button.completed{
  background:#063b24;

  color:#70e7bc;

  border:1px solid #087a4b;
}

/* =========================
   NAVIGATION
========================= */

.navigation{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:15px;
}

.nav-button{
  min-height:90px;

  padding:18px;

  text-align:left;

  border:1px solid #4b5550;

  border-radius:18px;

  background:#202120;

  color:#fff;

  cursor:pointer;
}

.nav-button:hover{
  border-color:#70e7bc;
}

.nav-button:disabled{
  opacity:.4;

  cursor:not-allowed;
}

.nav-button small{
  display:block;

  margin-bottom:7px;

  color:#70e7bc;

  font-weight:900;
}

.nav-button strong{
  display:block;

  line-height:1.4;
}

/* =========================
   LOADING
========================= */

.loading{
  padding:70px 20px;

  text-align:center;

  color:#70e7bc;

  font-weight:800;
}

.empty{
  padding:60px 20px;

  text-align:center;

  color:#a0ada7;

  line-height:1.7;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  header{
    min-height:75px;
  }

  .brand-mark{
    width:45px;
    height:45px;

    font-size:17px;
  }

  .brand-title{
    font-size:17px;
  }

  .brand-subtitle{
    font-size:7px;
  }

  .back-button{
    padding:9px 11px;

    font-size:12px;
  }

  main{
    width:90%;

    padding-top:22px;
  }

  .lesson-hero{
    padding:28px;
  }

  .lesson-content{
    padding:25px;
  }

  .lesson-content p{
    font-size:16px;
  }

  .navigation{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header>

  <a
    href="student.html"
    class="brand">

    <div class="brand-mark">
      AG
    </div>

    <div>

      <div class="brand-title">
        AGULIBRARY
      </div>

      <span class="brand-subtitle">
        LESSON READER
      </span>

    </div>

  </a>


  <a
    href="student.html"
    class="back-button">

    ← Dashboard

  </a>

</header>


<main>


<div
  id="status"
  class="status">
</div>


<section class="lesson-hero">

  <div class="eyebrow">
    AGULIBRARY • LESSON
  </div>


  <h1 id="lessonTitle">
    Loading lesson...
  </h1>


  <p id="lessonDescription">
    Please wait while your lesson loads.
  </p>


  <div
    id="lessonMeta"
    class="meta">
  </div>

</section>


<section class="progress-card">

  <div class="progress-top">

    <span>
      LESSON PROGRESS
    </span>

    <strong id="lessonPercent">
      0%
    </strong>

  </div>


  <div class="progress-track">

    <div
      id="lessonFill"
      class="progress-fill">
    </div>

  </div>

</section>


<section
  id="lessonContent"
  class="lesson-content">

  <div class="loading">
    Loading lesson content...
  </div>

</section>


<section class="complete-card">

  <h2>
    🎓 Complete This Lesson
  </h2>


  <p id="completeText">
    Study the lesson carefully, then mark it
    as completed when you finish.
  </p>


  <button
    id="completeButton"
    class="complete-button">

    ✓ Mark Lesson as Completed

  </button>

</section>


<section class="navigation">


  <button
    id="previousButton"
    class="nav-button"
    disabled>

    <small>
      ← PREVIOUS LESSON
    </small>

    <strong id="previousTitle">
      No previous lesson
    </strong>

  </button>


  <button
    id="nextButton"
    class="nav-button"
    disabled>

    <small>
      NEXT LESSON →
    </small>

    <strong id="nextTitle">
      No next lesson
    </strong>

  </button>


</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>


<script>

/* =====================================================
   AGULIBRARY LESSON READER
===================================================== */


let client =
  typeof getSupabase === "function"
    ? getSupabase()
    : null;


let currentUser = null;

let currentLesson = null;

let allLessons = [];

let completedLessons = [];


/* =====================================================
   MESSAGE
===================================================== */

function showStatus(
  text,
  type = "success"
){

  const box =
    document.getElementById(
      "status"
    );

  box.textContent = text;

  box.className =
    "status show " +
    type;

  setTimeout(
    function(){

      box.className =
        "status";

    },
    4000
  );

}


/* =====================================================
   GET LESSON ID
===================================================== */

function getLessonId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("lesson") ||
    params.get("resource")
  );

}


/* =====================================================
   COMPLETION STORAGE
===================================================== */

function completionKey(){

  if(!currentUser){

    return "AGU_COMPLETED_GUEST";

  }

  return (
    "AGU_COMPLETED_" +
    currentUser.id
  );

}


function getCompleted(){

  try{

    return JSON.parse(
      localStorage.getItem(
        completionKey()
      ) || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveCompleted(){

  localStorage.setItem(
    completionKey(),
    JSON.stringify(
      completedLessons
    )
  );

}


/* =====================================================
   CHECK COMPLETION
===================================================== */

function isCompleted(id){

  return completedLessons.some(
    item =>
      String(item) ===
      String(id)
  );

}


/* =====================================================
   MARK COMPLETE
===================================================== */

async function completeLesson(){

  if(!currentLesson){

    return;

  }


  const id =
    String(
      currentLesson.id
    );


  if(
    !isCompleted(id)
  ){

    completedLessons.push(
      id
    );

    saveCompleted();

  }


  updateCompletionUI();

  updateOverallProgress();


  showStatus(
    "🎉 Lesson completed! Your progress has been saved."
  );


  /*
    Optional Supabase backup.
    This does NOT stop local completion
    if the table does not exist.
  */

  if(client && currentUser){

    try{

      const result =
        await client
          .from(
            "student_completed_lessons"
          )
          .upsert(
            {
              user_id:
                currentUser.id,

              resource_id:
                currentLesson.id
            },
            {
              onConflict:
                "user_id,resource_id"
            }
          );


      if(result.error){

        console.warn(
          "Completion backup:",
          result.error
        );

      }

    }catch(error){

      console.warn(
        "Completion backup unavailable:",
        error
      );

    }

  }

}


/* =====================================================
   UPDATE COMPLETION UI
===================================================== */

function updateCompletionUI(){

  if(!currentLesson){

    return;

  }


  const done =
    isCompleted(
      currentLesson.id
    );


  const button =
    document.getElementById(
      "completeButton"
    );


  const text =
    document.getElementById(
      "completeText"
    );


  const percent =
    document.getElementById(
      "lessonPercent"
    );


  const fill =
    document.getElementById(
      "lessonFill"
    );


  if(done){

    button.textContent =
      "✓ Lesson Completed";


    button.classList.add(
      "completed"
    );


    text.textContent =
      "Excellent! You have completed this lesson. Continue to the next lesson when you are ready.";


    percent.textContent =
      "100%";


    fill.style.width =
      "100%";

  }else{

    button.textContent =
      "✓ Mark Lesson as Completed";


    button.classList.remove(
      "completed"
    );


    text.textContent =
      "Study the lesson carefully, then mark it as completed when you finish.";


    percent.textContent =
      "0%";


    fill.style.width =
      "0%";

  }

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(){

  if(!client){

    showStatus(
      "Supabase connection is not available.",
      "error"
    );

    return null;

  }


  const {
    data,
    error
  } =
    await client.auth.getSession();


  if(
    error ||
    !data ||
    !data.session
  ){

    window.location.href =
      "auth.html";

    return null;

  }


  return data.session.user;

}


/* =====================================================
   LOAD CURRENT LESSON
===================================================== */

async function loadCurrentLesson(){

  const id =
    getLessonId();


  if(!id){

    showNoLesson();

    return;

  }


  const {
    data,
    error
  } =
    await client
      .from("resources")
      .select("*")
      .eq(
        "id",
        id
      )
      .maybeSingle();


  if(error){

    console.error(
      error
    );


    showStatus(
      "Unable to load this lesson from the database.",
      "error"
    );


    showNoLesson();

    return;

  }


  if(!data){

    showNoLesson();

    return;

  }


  currentLesson =
    data;


  renderLesson();


  await loadLessonNavigation();


  updateCompletionUI();

}


/* =====================================================
   RENDER LESSON
===================================================== */

function renderLesson(){

  const lesson =
    currentLesson;


  document.getElementById(
    "lessonTitle"
  ).textContent =
    lesson.title ||
    "Untitled Lesson";


  document.getElementById(
    "lessonDescription"
  ).textContent =
    lesson.description ||
    "AGULIBRARY educational lesson.";


  const meta =
    document.getElementById(
      "lessonMeta"
    );


  meta.innerHTML =
    "";


  const values = [

    lesson.subject,

    lesson.level,

    lesson.class_level,

    lesson.term,

    lesson.type

  ];


  values.forEach(
    function(value){

      if(!value)return;


      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        value;


      meta.appendChild(
        span
      );

    }
  );


  const content =
    lesson.content ||
    lesson.lesson_content ||
    lesson.body ||
    lesson.text ||
    "";


  const fileUrl =
    lesson.file_url ||
    lesson.url ||
    "";


  const box =
    document.getElementById(
      "lessonContent"
    );


  if(content){

    /*
      Content from the resources table
      is expected to contain HTML.
    */

    box.innerHTML =
      content;

  }else{

    box.innerHTML = `

      <h2>
        ${escapeHTML(
          lesson.title ||
          "Lesson"
        )}
      </h2>

      <p>
        ${escapeHTML(
          lesson.description ||
          "This lesson does not have text content yet."
        )}
      </p>

      ${
        fileUrl
        ? `

          <div class="file-card">

            <strong>
              📚 Lesson Material
            </strong>

            <br>

            <a
              class="file-button"
              href="${escapeAttribute(
                fileUrl
              )}"
              target="_blank"
              rel="noopener noreferrer">

              Open Lesson Material →

            </a>

          </div>

        `
        : `
          <p>
            Lesson content has not been
            added yet.
          </p>
        `
      }

    `;

  }

}


/* =====================================================
   NO LESSON
===================================================== */

function showNoLesson(){

  document.getElementById(
    "lessonTitle"
  ).textContent =
    "Lesson Not Found";


  document.getElementById(
    "lessonDescription"
  ).textContent =
    "Return to the Student Dashboard and select a lesson.";


  document.getElementById(
    "lessonContent"
  ).innerHTML = `

    <div class="empty">

      <h2>
        📖 No Lesson Selected
      </h2>

      <p>
        This page needs a lesson ID.
      </p>

      <p>
        Return to the Student Dashboard
        and open a resource marked as
        <strong>LESSON</strong>.
      </p>

      <br>

      <a
        class="back-button"
        href="student.html">

        ← Return to Dashboard

      </a>

    </div>

  `;

}


/* =====================================================
   LOAD LESSON NAVIGATION
===================================================== */

async function loadLessonNavigation(){

  const {
    data,
    error
  } =
    await client
      .from("resources")
      .select("*")
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.warn(
      "Navigation error:",
      error
    );

    allLessons =
      [currentLesson];

    updateNavigation();

    return;

  }


  allLessons =
    (data || [])
      .filter(
        function(item){

          const type =
            String(
              item.type || ""
            ).toLowerCase();


          return (
            type === "lesson" ||
            type === "course"
          );

        }
      );


  if(
    !allLessons.some(
      item =>
        String(item.id) ===
        String(currentLesson.id)
    )
  ){

    allLessons.push(
      currentLesson
    );

  }


  updateNavigation();

}


/* =====================================================
   NAVIGATION
===================================================== */

function updateNavigation(){

  if(!currentLesson){

    return;

  }


  const index =
    allLessons.findIndex(
      item =>
        String(item.id) ===
        String(
          currentLesson.id
        )
    );


  const previous =
    index > 0
      ? allLessons[index - 1]
      : null;


  const next =
    index >= 0 &&
    index < allLessons.length - 1
      ? allLessons[index + 1]
      : null;


  const previousButton =
    document.getElementById(
      "previousButton"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  if(previous){

    previousButton.disabled =
      false;


    document.getElementById(
      "previousTitle"
    ).textContent =
      previous.title ||
      "Previous lesson";


    previousButton.onclick =
      function(){

        openLesson(
          previous.id
        );

      };

  }else{

    previousButton.disabled =
      true;


    document.getElementById(
      "previousTitle"
    ).textContent =
      "No previous lesson";

  }


  if(next){

    nextButton.disabled =
      false;


    document.getElementById(
      "nextTitle"
    ).textContent =
      next.title ||
      "Next lesson";


    nextButton.onclick =
      function(){

        openLesson(
          next.id
        );

      };

  }else{

    nextButton.disabled =
      true;


    document.getElementById(
      "nextTitle"
    ).textContent =
      "No next lesson";

  }

}


/* =====================================================
   OPEN LESSON
===================================================== */

function openLesson(id){

  window.location.href =
    "lesson.html?id=" +
    encodeURIComponent(
      id
    );

}


/* =====================================================
   OVERALL PROGRESS
===================================================== */

function updateOverallProgress(){

  if(!currentUser){

    return;

  }


  if(!allLessons.length){

    return;

  }


  const total =
    allLessons.length;


  const completed =
    allLessons.filter(
      lesson =>
        isCompleted(
          lesson.id
        )
    ).length;


  const percentage =
    Math.round(
      (
        completed /
        total
      ) * 100
    );


  localStorage.setItem(
    "AGU_PROGRESS_" +
    currentUser.id,

    String(
      percentage
    )
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(character){

      const entities = {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      };

      return entities[
        character
      ];

    }
  );

}


function escapeAttribute(value){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}


/* =====================================================
   COMPLETE BUTTON
===================================================== */

document
  .getElementById(
    "completeButton"
  )
  .addEventListener(
    "click",
    completeLesson
  );


/* =====================================================
   START
===================================================== */

async function start(){

  currentUser =
    await loadUser();


  if(!currentUser){

    return;

  }


  completedLessons =
    getCompleted();


  await loadCurrentLesson();

}


start();

</script>

</body>
</html>
