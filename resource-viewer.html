<title>AGULIBRARY — Resource Viewer</title>

<style>

*{

}

html,
body{

  align-items:center;

}

.brand-mark{

========================================================= */

  background:#fff;

========================================================= */

  border-radius:12px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.12);

/* =========================================================
   VIDEO
========================================================= */

/* =========================================================

.viewer-audio-box{

  padding:40px 25px;

  border:1px solid #dceee6;

  width:100%;

/* =========================================================

========================================================= */

.viewer-pdf{

  background:#fff;
}

/* =========================================================
   FILE FALLBACK
========================================================= */

  background:#fff;

  border:1px solid #dceee6;

}

.file-icon{

/* =========================================================

========================================================= */

.loading{

  min-height:500px;

  place-items:center;

  text-align:center;

  color:#087a4b;

  font-size:17px;

  border-top-color:#087a4b;

  border-radius:50%;

}

/* =========================================================

========================================================= */

  border-top:1px solid #dceee6;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>


<script>

let client = null;

let currentResource = null;

let currentUser = null;

let isSaved = false;


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    const year =
      document.getElementById("year");

    if(year){

      year.textContent =
        new Date().getFullYear();

    }

    await startViewer();

  }
);


/* =========================================================
   START VIEWER
========================================================= */

async function startViewer(){

  try{

    if(
      typeof getSupabase !== "function"
    ){

      showError(
        "Supabase connection is unavailable."
      );

      return;

    }


    client =
      getSupabase();


    if(
      !client ||
      !client.auth
    ){

      showError(
        "Supabase authentication is unavailable."
      );

      return;

    }


    const sessionResult =
      await client.auth.getSession();


    if(sessionResult.error){

      console.error(
        "Session error:",
        sessionResult.error
      );

      showError(
        "Unable to verify your account."
      );

      return;

    }


    const session =
      sessionResult.data &&
      sessionResult.data.session;


    if(!session){

      window.location.href =
        "auth.html";

      return;

    }


    currentUser =
      session.user;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    if(!id){

      showError(
        "No resource was selected."
      );

      return;

    }


    await loadResource(id);

  }catch(error){

    console.error(
      "Viewer startup error:",
      error
    );

    showError(
      "Something went wrong while opening this resource."
    );

  }

}


/* =========================================================
   LOAD RESOURCE
========================================================= */

async function loadResource(id){

  const {
    data,
    error
  } =
    await client
      .from("resources")
      .select("*")
      .eq("id", id)
      .maybeSingle();


  if(error){

    console.error(
      "Resource loading error:",
      error
    );

    showError(
      "The resource could not be loaded."
    );

    return;

  }


  if(!data){

    showError(
      "This resource does not exist."
    );

    return;

  }


  currentResource =
    data;


  displayResource(
    data
  );


  await checkIfSaved(
    data.id
  );


  recordRecentResource(
    data.id
  );

}


/* =========================================================
   DISPLAY RESOURCE
========================================================= */

function displayResource(resource){

  document.title =
    (
      resource.title ||
      "AGULIBRARY Resource"
    ) +
    " — AGULIBRARY";


  const info =
    document.getElementById(
      "resourceInfo"
    );


  if(info){

    info.style.display =
      "block";

  }


  setText(
    "resourceTitle",
    resource.title ||
    "Untitled Resource"
  );


  setText(
    "resourceSubject",
    resource.subject ||
    resource.subject_area ||
    resource.subject_name ||
    ""
  );


  setText(
    "resourceDescription",
    resource.description ||
    "Educational resource from AGULIBRARY."
  );


  setText(
    "resourceType",
    getFriendlyType(
      resource
    )
  );


  const meta =
    document.getElementById(
      "resourceMeta"
    );


  if(meta){

    meta.innerHTML = "";


    addMeta(
      meta,
      resource.level
    );


    addMeta(
      meta,
      resource.class_level
    );


    addMeta(
      meta,
      resource.term
    );


    addMeta(
      meta,
      resource.education_stage
    );


    addMeta(
      meta,
      resource.is_premium
        ? "Premium"
        : ""
    );

  }


  setText(
    "viewerToolbarTitle",
    resource.title ||
    "AGULIBRARY Resource Viewer"
  );


  renderResourceContent(
    resource
  );

}


/* =========================================================
   FRIENDLY RESOURCE TYPE
========================================================= */

function getFriendlyType(resource){

  const type =
    String(
      resource.type ||
      ""
    )
    .toLowerCase()
    .trim();


  const names = {

    digital_book:
      "DIGITAL BOOK",

    book:
      "BOOK",

    pdf:
      "PDF",

    video:
      "VIDEO",

    photo:
      "IMAGE",

    image:
      "IMAGE",

    audio:
      "AUDIO",

    document:
      "DOCUMENT",

    course:
      "COURSE",

    lesson:
      "LESSON"

  };


  if(names[type]){

    return names[type];

  }


  return (
    type ||
    "RESOURCE"
  ).toUpperCase();

}


/* =========================================================
   META
========================================================= */

function addMeta(
  container,
  value
){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){

    return;

  }


  const span =
    document.createElement(
      "span"
    );


  span.textContent =
    String(value);


  container.appendChild(
    span
  );

}


/* =========================================================
   GET RESOURCE URL
========================================================= */

function getResourceURL(resource){

  const raw =
    resource.file_url ||
    resource.url ||
    resource.file ||
    resource.fileUrl ||
    "";


  if(!raw){

    return "";

  }


  const value =
    String(raw).trim();


  if(!value){

    return "";

  }


  /*
   * Absolute URL:
   * https://...
   */

  if(
    /^https?:\/\//i.test(value)
  ){

    return value;

  }


  /*
   * Protocol-relative URL:
   * //example.com/file
   */

  if(
    value.startsWith("//")
  ){

    return (
      window.location.protocol +
      value
    );

  }


  /*
   * Root-relative URL:
   * /books/...
   */

  if(
    value.startsWith("/")
  ){

    return (
      window.location.origin +
      value
    );

  }


  /*
   * Relative URL:
   * books/...
   */

  return new URL(
    value,
    window.location.href
  ).href;

}


/* =========================================================
   GET FILE EXTENSION
========================================================= */

function getFileExtension(url){

  try{

    const clean =
      String(url || "")
        .split("#")[0]
        .split("?")[0];


    const filename =
      clean.substring(
        clean.lastIndexOf("/") + 1
      );


    const dot =
      filename.lastIndexOf(".");


    if(dot === -1){

      return "";

    }


    return filename
      .substring(dot + 1)
      .toLowerCase();

  }catch(error){

    return "";

  }

}


/* =========================================================
   RESOURCE TYPE DETECTION
========================================================= */

function detectResourceKind(resource,url){

  const type =
    String(
      resource.type ||
      ""
    )
    .toLowerCase()
    .trim();


  const extension =
    getFileExtension(url);


  /*
   * DIGITAL BOOK
   *
   * This is important because admin.js
   * stores digital books as:
   *
   * /books/.../index.html
   */

  if(type === "digital_book"){

    return "digital_book";

  }


  /*
   * IMAGE
   */

  if(
    type === "photo" ||
    type === "image"
  ){

    return "image";

  }


  /*
   * VIDEO
   */

  if(type === "video"){

    return "video";

  }


  /*
   * AUDIO
   */

  if(type === "audio"){

    return "audio";

  }


  /*
   * PDF
   */

  if(type === "pdf"){

    return "pdf";

  }


  /*
   * DOCUMENT
   */

  if(type === "document"){

    return "document";

  }


  /*
   * BOOK / COURSE / LESSON
   *
   * Determine from actual file.
   */

  if(
    type === "book" ||
    type === "course" ||
    type === "lesson"
  ){

    if(
      extension === "pdf"
    ){

      return "pdf";

    }


    if(
      [
        "html",
        "htm"
      ].includes(extension)
    ){

      return "digital_book";

    }


    if(
      [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "svg",
        "bmp",
        "avif"
      ].includes(extension)
    ){

      return "image";

    }


    if(
      [
        "mp4",
        "webm",
        "ogg",
        "mov",
        "m4v"
      ].includes(extension)
    ){

      return "video";

    }


    if(
      [
        "mp3",
        "wav",
        "m4a",
        "aac",
        "flac",
        "oga"
      ].includes(extension)
    ){

      return "audio";

    }


    return "file";

  }


  /*
   * AUTOMATIC EXTENSION DETECTION
   *
   * This makes the viewer useful for
   * resources whose database type is
   * not perfectly set.
   */

  if(
    [
      "jpg",
      "jpeg",
      "png",
      "gif",
      "webp",
      "svg",
      "bmp",
      "avif"
    ].includes(extension)
  ){

    return "image";

  }


  if(
    [
      "mp4",
      "webm",
      "ogg",
      "mov",
      "m4v"
    ].includes(extension)
  ){

    return "video";

  }


  if(
    [
      "mp3",
      "wav",
      "m4a",
      "aac",
      "flac",
      "oga"
    ].includes(extension)
  ){

    return "audio";

  }


  if(
    extension === "pdf"
  ){

    return "pdf";

  }


  if(
    [
      "html",
      "htm"
    ].includes(extension)
  ){

    return "digital_book";

  }


  return "file";

}


/* =========================================================
   RENDER RESOURCE
========================================================= */

function renderResourceContent(resource){

  const area =
    document.getElementById(
      "contentArea"
    );


  if(!area){

    return;

  }


  const url =
    getResourceURL(
      resource
    );


  if(!url){

    area.innerHTML =
      createNoFileMessage();

    return;

  }


  const kind =
    detectResourceKind(
      resource,
      url
    );


  console.log(
    "AGULIBRARY viewer:",
    {
      type:resource.type,
      url:url,
      kind:kind
    }
  );


  /* =====================================================
     DIGITAL BOOK
  ===================================================== */

  if(
    kind === "digital_book"
  ){

    area.innerHTML = `

      <iframe
        class="digital-book-viewer"
        src="${escapeAttr(url)}"
        title="${escapeAttr(
          resource.title ||
          "AGULIBRARY Digital Book"
        )}"
        loading="eager"
        allowfullscreen>
      </iframe>

    `;

    return;

  }


  /* =====================================================
     IMAGE
  ===================================================== */

  if(
    kind === "image"
  ){

    area.innerHTML = `

      <img
        class="viewer-image"
        src="${escapeAttr(url)}"
        alt="${escapeAttr(
          resource.title ||
          "AGULIBRARY Image"
        )}"
        loading="eager"
        onerror="resourceLoadFailed()"
      >

    `;

    return;

  }


  /* =====================================================
     VIDEO
  ===================================================== */

  if(
    kind === "video"
  ){

    area.innerHTML = `

      <video
        class="viewer-video"
        controls
        playsinline
        preload="metadata">

        <source
          src="${escapeAttr(url)}"
        >

        Your browser does not support
        video playback.

      </video>

    `;

    return;

  }


  /* =====================================================
     AUDIO
  ===================================================== */

  if(
    kind === "audio"
  ){

    area.innerHTML = `

      <div class="viewer-audio-box">

        <div class="file-icon">
          🎧
        </div>

        <h2>
          ${escapeHTML(
            resource.title ||
            "Audio Resource"
          )}
        </h2>

        <p>
          Listen to this AGULIBRARY
          educational audio resource.
        </p>

        <audio
          controls
          preload="metadata">

          <source
            src="${escapeAttr(url)}"
          >

          Your browser does not support
          audio playback.

        </audio>

        <br>

        <a
          class="file-open"
          href="${escapeAttr(url)}"
          target="_blank"
          rel="noopener noreferrer">

          Open Audio →

        </a>

      </div>

    `;

    return;

  }


  /* =====================================================
     PDF
  ===================================================== */

  if(
    kind === "pdf"
  ){

    area.innerHTML = `

      <iframe
        class="viewer-pdf"
        src="${escapeAttr(url)}"
        title="${escapeAttr(
          resource.title ||
          "AGULIBRARY PDF"
        )}">
      </iframe>

    `;

    return;

  }


  /* =====================================================
     OTHER FILE
  ===================================================== */

  area.innerHTML =
    createFileFallback(
      getFileIcon(
        getFileExtension(url)
      ),
      getFileTitle(
        resource,
        getFileExtension(url)
      ),
      url
    );

}


/* =========================================================
   NO FILE MESSAGE
========================================================= */

function createNoFileMessage(){

  return `

    <div class="file-fallback">

      <div class="file-icon">
        📁
      </div>

      <h2>
        No file attached
      </h2>

      <p>
        This resource has been published,
        but no file URL is attached to it.
      </p>

    </div>

  `;

}


/* =========================================================
   FILE FALLBACK
========================================================= */

function createFileFallback(
  icon,
  title,
  url
){

  return `

    <div class="file-fallback">

      <div class="file-icon">
        ${icon}
      </div>

      <h2>
        ${escapeHTML(title)}
      </h2>

      <p>
        This resource is available as
        an external file.
      </p>

      <a
        class="file-open"
        href="${escapeAttr(url)}"
        target="_blank"
        rel="noopener noreferrer">

        Open Resource →

      </a>

    </div>

  `;

}


/* =========================================================
   FILE ICON
========================================================= */

function getFileIcon(extension){

  const icons = {

    doc:
      "📝",

    docx:
      "📝",

    txt:
      "📄",

    rtf:
      "📄",

    xls:
      "📊",

    xlsx:
      "📊",

    csv:
      "📊",

    ppt:
      "📊",

    pptx:
      "📊",

    zip:
      "🗜️",

    rar:
      "🗜️",

    epub:
      "📚",

    mobi:
      "📚",

    pdf:
      "📄"

  };


  return (
    icons[
      extension
    ] ||
    "📘"
  );

}


/* =========================================================
   FILE TITLE
========================================================= */

function getFileTitle(
  resource,
  extension
){

  if(
    resource.type === "course"
  ){

    return "Educational Course";

  }


  if(
    resource.type === "lesson"
  ){

    return "Educational Lesson";

  }


  if(
    resource.type === "book"
  ){

    return "Educational Book";

  }


  if(extension){

    return (
      extension.toUpperCase() +
      " Resource"
    );

  }


  return "Educational Resource";

}


/* =========================================================
   RESOURCE LOAD FAILURE
========================================================= */

function resourceLoadFailed(){

  const area =
    document.getElementById(
      "contentArea"
    );


  if(!area){

    return;

  }


  if(!currentResource){

    return;

  }


  const url =
    getResourceURL(
      currentResource
    );


  area.innerHTML =
    createFileFallback(
      "📁",
      "Resource",
      url
    );

}


/* =========================================================
   OPEN ORIGINAL
========================================================= */

function openOriginal(){

  if(!currentResource){

    return;

  }


  const url =
    getResourceURL(
      currentResource
    );


  if(!url){

    alert(
      "This resource does not have a file attached."
    );

    return;

  }


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   SAVE RESOURCE
========================================================= */

async function checkIfSaved(resourceId){

  if(
    !currentUser ||
    !resourceId
  ){

    return;

  }


  try{

    const {
      data,
      error
    } =
      await client
        .from(
          "student_saved_resources"
        )
        .select("id")
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "resource_id",
          resourceId
        )
        .maybeSingle();


    if(error){

      console.warn(
        "Save check:",
        error
      );

      return;

    }


    isSaved =
      !!data;


    updateSaveButton();

  }catch(error){

    console.warn(
      "Save check error:",
      error
    );

  }

}


/* =========================================================
   TOGGLE SAVE
========================================================= */

async function toggleSave(){

  if(
    !currentUser ||
    !currentResource
  ){

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  if(button){

    button.disabled =
      true;

  }


  try{

    if(isSaved){

      const {
        error
      } =
        await client
          .from(
            "student_saved_resources"
          )
          .delete()
          .eq(
            "user_id",
            currentUser.id
          )
          .eq(
            "resource_id",
            currentResource.id
          );


      if(error){

        throw error;

      }


      isSaved =
        false;

    }else{

      const {
        error
      } =
        await client
          .from(
            "student_saved_resources"
          )
          .insert({

            user_id:
              currentUser.id,

            resource_id:
              currentResource.id

          });


      if(error){

        throw error;

      }


      isSaved =
        true;

    }


    updateSaveButton();

  }catch(error){

    console.error(
      "Save error:",
      error
    );

    alert(
      "Unable to update saved resource. Please try again."
    );

  }finally{

    if(button){

      button.disabled =
        false;

    }

  }

}


/* =========================================================
   SAVE BUTTON
========================================================= */

function updateSaveButton(){

  const button =
    document.getElementById(
      "saveButton"
    );


  if(!button){

    return;

  }


  if(isSaved){

    button.textContent =
      "★ Saved";

    button.classList.add(
      "saved"
    );

  }else{

    button.textContent =
      "☆ Save";

    button.classList.remove(
      "saved"
    );

  }

}


/* =========================================================
   RECENT RESOURCE
========================================================= */

async function recordRecentResource(
  resourceId
){

  if(
    !currentUser ||

  ){

    return;

  }

/* =========================================================
   BACK
========================================================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      window.location.hostname
    )
  ){

    window.history.back();

    return;

  }


  window.location.href =
    "student-dashboard.html";

}


/* =========================================================
   TEXT
========================================================= */

function setText(
  id,
  value
){

  const element =
    document.getElementById(
      id
    );


  if(element){

    element.textContent =
      value || "";

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(character){

      const entities = {

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#039;"

      };


      return entities[
        character
      ];

    }
  );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(value){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  const area =
    document.getElementById(
      "contentArea"
    );


  if(!area){

    return;

  }


  area.innerHTML = `

    <div class="error-box">

      ⚠️

      <h2>
        AGULIBRARY
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <button
        type="button"
        onclick="goBack()">

        ← Return to AGULIBRARY

      </button>

    </div>

  `;

}


/* =========================================================
   SAVE BUTTON EVENT
========================================================= */

const saveButton =
  document.getElementById(
    "saveButton"
  );


if(saveButton){

  saveButton.addEventListener(
    "click",
    toggleSave
  );

}
