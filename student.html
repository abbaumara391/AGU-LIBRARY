<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AGULIBRARY — Student Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   AGULIBRARY — PHASE 4 STUDENT DASHBOARD
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#111513;
  color:#eaf7f1;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

.student-header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  padding:12px 5%;

  background:#1b1e1d;

  border-bottom:1px solid #39433e;

  backdrop-filter:blur(14px);
}

.student-brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.mark{
  width:56px;
  height:56px;

  display:grid;
  place-items:center;

  border-radius:18px;

  background:#087a4b;

  color:white;

  font-size:22px;
  font-weight:900;
}

.student-brand b{
  display:block;
  font-size:21px;
}

.student-brand small{
  display:block;
  margin-top:3px;

  color:#8d9c95;

  font-size:9px;
  letter-spacing:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.back{
  color:#6de5ba;
  text-decoration:none;
  font-weight:800;
}

.logout{
  border:1px solid #4c5751;
  background:#292d2b;
  color:#70e7bc;

  padding:11px 17px;

  border-radius:12px;

  font-weight:800;

  cursor:pointer;
}

.logout:hover{
  background:#087a4b;
  color:#fff;
}


/* =========================================================
   MAIN
========================================================= */

.dashboard{
  width:min(1250px,100%);
  margin:auto;

  padding:32px 5% 80px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:none;

  padding:14px 18px;

  margin-bottom:20px;

  border-radius:14px;

  font-weight:800;
}

.message.show{
  display:block;
}

.message.success{
  background:#073d27;
  color:#71e8bd;
}

.message.error{
  background:#421e1e;
  color:#ff9e9e;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome{
  background:
    linear-gradient(
      135deg,
      #003b18,
      #00602a
    );

  border:1px solid #176c41;

  border-radius:30px;

  padding:40px;

  margin-bottom:22px;
}

.eyebrow{
  color:#70e7bc;

  font-size:12px;

  font-weight:900;

  letter-spacing:3px;
}

.welcome h1{
  margin:14px 0;

  font-size:
    clamp(38px,6vw,60px);

  line-height:1.05;

  color:#f0fff8;
}

.welcome p{
  max-width:760px;

  color:#c3d8ce;

  line-height:1.7;

  font-size:17px;
}


/* =========================================================
   TOP STAT CARDS
========================================================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;

  margin-bottom:22px;
}

.stat{
  padding:23px;

  min-height:135px;

  background:#1d211f;

  border:1px solid #414c46;

  border-radius:22px;
}

.stat strong{
  display:block;

  color:#70e7bc;

  font-size:38px;

  margin-bottom:8px;
}

.stat span{
  color:#a9b7b0;

  font-size:14px;
}


/* =========================================================
   PROFILE + ACCOUNT
========================================================= */

.profile-layout{
  display:grid;

  grid-template-columns:
    1.2fr .8fr;

  gap:16px;

  margin-bottom:22px;
}

.profile-card,
.account-card{
  background:#1d211f;

  border:1px solid #414c46;

  border-radius:26px;

  padding:30px;
}

.profile-card{
  display:flex;

  align-items:center;

  gap:22px;
}

.profile-avatar{
  width:100px;
  height:100px;

  flex-shrink:0;

  display:grid;
  place-items:center;

  border-radius:30px;

  background:#003e18;

  border:1px solid #087a4b;

  color:#f2fff9;

  font-size:30px;

  font-weight:900;
}

.profile-info h2{
  margin:8px 0;

  font-size:32px;
}

.profile-info p{
  margin:0;

  color:#a9b7b1;

  word-break:break-word;
}

.profile-tag{
  display:inline-flex;

  margin-top:10px;

  padding:6px 11px;

  border-radius:20px;

  background:#073c25;

  color:#70e7bc;

  font-size:12px;

  font-weight:800;
}

.account-card h2{
  margin:9px 0 20px;

  font-size:28px;
}

.account-status{
  display:flex;

  align-items:center;

  gap:9px;

  margin-bottom:15px;

  color:#70e7bc;

  font-weight:800;
}

.status-dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#35d978;

  box-shadow:
    0 0 12px rgba(53,217,120,.7);
}

.account-info{
  color:#aab7b1;

  line-height:1.7;

  font-size:14px;
}

.account-code{
  display:none;

  margin-top:15px;

  padding:10px 13px;

  border-radius:10px;

  background:#28202e;

  color:#d89bff;

  font-weight:800;

  letter-spacing:1px;
}

.account-code.show{
  display:block;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-card{
  background:#1d211f;

  border:1px solid #414c46;

  border-radius:26px;

  padding:30px;

  margin-bottom:22px;
}

.progress-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;
}

.progress-header h2{
  margin:9px 0 0;

  font-size:32px;
}

#progressPercent{
  color:#70e7bc;

  font-size:48px;

  font-weight:900;
}

.progress-bar{
  height:17px;

  margin-top:24px;

  overflow:hidden;

  background:#10251b;

  border-radius:50px;
}

.progress-fill{
  width:0;

  height:100%;

  background:#087a4b;

  border-radius:50px;

  transition:
    width .5s ease;
}

.progress-card>p{
  color:#a9b7b1;

  line-height:1.6;
}


/* =========================================================
   SUBJECTS
========================================================= */

.subjects-card{
  background:#1d211f;

  border:1px solid #414c46;

  border-radius:26px;

  padding:30px;

  margin-bottom:22px;
}

.subjects-card h2{
  margin:9px 0 22px;

  font-size:32px;
}

.subjects-grid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:11px;
}

.subject-item{
  min-height:100px;

  padding:15px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:flex-start;
