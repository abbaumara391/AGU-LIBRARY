<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f4fbf7;
  color:#17352a;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

/* =====================================================
   HEADER
===================================================== */

.student-header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:78px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  padding:11px 5%;

  background:rgba(255,255,255,.97);
  border-bottom:1px solid #dceee6;

  box-shadow:0 5px 22px rgba(8,122,75,.07);

  backdrop-filter:blur(14px);
}

.student-brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.mark{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;

  border-radius:16px;

  background:#087a4b;
  color:#fff;

  font-size:21px;
  font-weight:900;

  box-shadow:0 8px 18px rgba(8,122,75,.18);
}

.student-brand b{
  display:block;
  color:#123d2d;
  font-size:20px;
}

.student-brand small{
  display:block;
  margin-top:3px;
  color:#6d8178;
  font-size:9px;
  letter-spacing:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.back{
  color:#087a4b;
  text-decoration:none;
  font-weight:800;
}

.logout{
  border:1px solid #b9dccd;
  background:#fff;
  color:#087a4b;

  padding:10px 16px;

  border-radius:11px;

  font-weight:800;
  cursor:pointer;
}

.logout:hover{
  background:#087a4b;
  color:#fff;
}

/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button{
  width:48px;
  height:48px;

  border:1px solid #cfe5da;
  border-radius:14px;

  background:#fff;
  color:#087a4b;

  font-size:25px;
  font-weight:900;

  cursor:pointer;
}

.menu-button:hover{
  background:#e8f8f0;
}

/* =====================================================
   SIDE MENU
===================================================== */

.side-menu-overlay{
  position:fixed;
  inset:0;

  background:rgba(10,35,25,.45);

  z-index:4999;

  opacity:0;
  pointer-events:none;

  transition:.3s ease;
}

.side-menu-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.student-side-menu{
  position:fixed;

  top:0;
  left:0;

  width:min(390px,88vw);
  height:100vh;

  background:#fff;

  z-index:5000;

  padding:25px;

  overflow-y:auto;

  transform:translateX(-105%);

  transition:transform .3s ease;

  box-shadow:15px 0 45px rgba(0,0,0,.15);
}

.student-side-menu.open{
  transform:translateX(0);
}

.side-menu-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:15px;

  padding-bottom:20px;

  border-bottom:1px solid #dceee6;
}

.side-menu-header h2{
  margin:8px 0 0;
  color:#173b2d;
}

.close-menu-button{
  width:44px;
  height:44px;

  border:1px solid #dce5e0;
  border-radius:12px;

  background:#f7fcfa;
  color:#17352a;

  font-size:30px;

  cursor:pointer;
}

.side-profile,
.side-account{
  margin-top:20px;

  padding:20px;

  background:#f7fcfa;

  border:1px solid #dceee6;

  border-radius:20px;
}

.profile-avatar{
  width:96px;
  height:96px;

  display:grid;
  place-items:center;

  border-radius:28px;

  background:#e5f7ee;

  border:1px solid #bfe6d3;

  color:#087a4b;

  font-size:29px;
  font-weight:900;
}

.side-profile .profile-avatar{
  width:72px;
  height:72px;
  border-radius:20px;
  font-size:24px;
  margin-bottom:15px;
}

.eyebrow{
  color:#087a4b;
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
}

.profile-info h2{
  margin:7px 0;
  font-size:29px;
  color:#173b2d;
}

.side-profile .profile-info h2{
  font-size:22px;
}

.profile-info p{
  margin:0;
  color:#72847c;
  word-break:break-word;
}

.profile-tag{
  display:inline-flex;

  margin-top:10px;

  padding:6px 11px;

  border-radius:20px;

  background:#e8f8f0;
  color:#087a4b;

  font-size:12px;
  font-weight:800;
}

.side-account h2{
  margin:8px 0 15px;
  color:#173b2d;
}

.account-status{
  display:flex;
  align-items:center;
  gap:9px;

  margin-bottom:13px;

  color:#087a4b;
  font-weight:800;
}

.status-dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#22b573;
}

.account-info{
  color:#72847c;
  line-height:1.7;
  font-size:14px;
}

.side-menu-links{
  display:grid;
  gap:10px;
  margin-top:20px;
}

.side-menu-links button{
  width:100%;

  padding:15px;

  border:1px solid #dceee6;
  border-radius:14px;

  background:#fff;

  color:#173b2d;

  text-align:left;

  font-weight:800;
  font-size:14px;

  cursor:pointer;
}

.side-menu-links button:hover{
  background:#e8f8f0;
}

/* =====================================================
   DASHBOARD
===================================================== */

.dashboard{
  width:min(1250px,100%);

  margin:auto;

  padding:30px 5% 80px;
}

.message{
  display:none;

  padding:14px 18px;

  margin-bottom:20px;

  border-radius:14px;

  font-weight:800;
}

.message.show{
  display:block;
}

.message.success{
  background:#e8f8f0;
  border:1px solid #c5ead8;
  color:#087a4b;
}

.message.error{
  background:#fff0f0;
  border:1px solid #f1cccc;
  color:#b42323;
}

/* =====================================================
   WELCOME
===================================================== */

.welcome{
  position:relative;

  overflow:hidden;

  background:linear-gradient(135deg,#e9f9f1,#fff);

  border:1px solid #ccebdd;

  border-radius:28px;

  padding:38px;

  margin-bottom:22px;

  box-shadow:0 15px 40px rgba(8,122,75,.07);
}

.welcome:after{
  content:"";

  position:absolute;

  width:220px;
  height:220px;

  right:-70px;
  top:-90px;

  border-radius:50%;

  background:#d7f4e6;

  opacity:.7;
}

.welcome h1{
  position:relative;
  z-index:2;

  margin:13px 0;

  font-size:clamp(34px,6vw,58px);

  line-height:1.05;

  color:#123d2d;
}

.welcome h1 span{
  color:#087a4b;
}

.welcome p{
  position:relative;
  z-index:2;

  max-width:760px;

  color:#61766d;

  line-height:1.7;

  font-size:16px;
}

/* =====================================================
   AGULIBRARY AI TEACHER
   ONLY THE AI TEACHER PICTURE IS SHOWN
   AI CONTENT OPENS WHEN PICTURE IS CLICKED
===================================================== */

.ai-agent{
  position:fixed !important;

  top:92px !important;
  right:20px !important;

  width:72px !important;
  height:72px !important;

  margin:0 !important;
  padding:0 !important;

  background:transparent !important;

  border:0 !important;
  border-radius:50% !important;

  box-shadow:none !important;

  z-index:4500 !important;
}

.ai-agent-header{
  display:block !important;

  width:72px !important;
  height:72px !important;

  margin:0 !important;
  padding:0 !important;
}

.ai-agent-avatar{
  display:block !important;

  width:72px !important;
  height:72px !important;

  margin:0 !important;
  padding:0 !important;

  flex-shrink:0;

  border-radius:50% !important;

  object-fit:cover !important;

  border:4px solid #fff !important;

  background:#e8f8f0 !important;

  box-shadow:
    0 8px 25px rgba(8,122,75,.25) !important;

  cursor:pointer !important;

  transition:
    transform .2s ease,
    box-shadow .2s ease !important;
}

.ai-agent-avatar:hover{
  transform:scale(1.06);

  box-shadow:
    0 10px 30px rgba(8,122,75,.32) !important;
}


/* -----------------------------------------------------
   HIDE AI TITLE / DESCRIPTION / STATUS
----------------------------------------------------- */

.ai-agent-heading,
.ai-agent-status{
  display:none !important;
}


/* =====================================================
   AI CHAT WINDOW
   FIXED TO THE AVAILABLE VIEWPORT
===================================================== */

.ai-chat-card{
  display:none !important;

  position:fixed !important;

  top:85px !important;
  right:20px !important;

  width:min(650px,calc(100vw - 40px)) !important;

  height:min(760px,calc(100vh - 105px)) !important;

  max-height:calc(100dvh - 105px) !important;

  margin:0 !important;
  padding:20px !important;

  background:#fff !important;

  border:1px solid #cfe5da !important;

  border-radius:24px !important;

  box-shadow:
    0 20px 60px rgba(0,0,0,.22) !important;

  z-index:4400 !important;

  overflow:hidden !important;

  flex-direction:column !important;
}


/* =====================================================
   OPEN STATE
===================================================== */

.ai-agent.ai-open{
  width:58px !important;
  height:58px !important;
}

.ai-agent.ai-open .ai-agent-header{
  width:58px !important;
  height:58px !important;
}

.ai-agent.ai-open .ai-agent-avatar{
  position:fixed !important;

  top:96px !important;
  right:40px !important;

  width:58px !important;
  height:58px !important;

  z-index:4600 !important;
}

.ai-agent.ai-open .ai-chat-card{
  display:flex !important;
}


/* =====================================================
   AI MESSAGES
===================================================== */

.ai-agent-messages{
  flex:1 1 auto !important;

  height:auto !important;

  min-height:0 !important;

  max-height:none !important;

  overflow-y:auto !important;

  padding:5px !important;

  margin-bottom:18px !important;

  -webkit-overflow-scrolling:touch !important;
}

.ai-message{
  display:flex;

  align-items:flex-start;

  gap:12px;

  margin-bottom:18px;
}

.ai-message.user{
  flex-direction:row-reverse;
}

.ai-message-avatar{
  width:48px;
  height:48px;

  flex-shrink:0;

  border-radius:50%;

  overflow:hidden;

  background:#e8f8f0;

  display:grid;

  place-items:center;
}

.ai-message-avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.ai-message.user .ai-message-avatar{
  background:#087a4b;

  color:#fff;

  font-size:20px;
}

.ai-message-content{
  max-width:82%;
