<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>AGULIBRARY — Course</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f4fbf7;
  color:#17352a;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:76px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  padding:11px 5%;

  background:rgba(255,255,255,.97);

  border-bottom:1px solid #dceee6;

  box-shadow:
    0 5px 22px rgba(8,122,75,.06);

  backdrop-filter:blur(14px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:50px;
  height:50px;

  display:grid;
  place-items:center;

  border-radius:15px;

  background:#087a4b;
  color:#fff;

  font-size:20px;
  font-weight:900;

  box-shadow:
    0 8px 18px rgba(8,122,75,.16);
}

.brand-name{
  font-size:20px;
  font-weight:900;
  color:#173b2d;
}

.brand-subtitle{
  margin-top:2px;

  color:#74877f;

  font-size:9px;
  letter-spacing:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-button{
  border:1px solid #bcdccc;

  background:#fff;

  color:#087a4b;

  padding:10px 14px;

  border-radius:11px;

  font-weight:800;

  text-decoration:none;

  cursor:pointer;
}

.header-button:hover{
  background:#087a4b;
  color:#fff;
}


/* =========================================================
   MAIN
========================================================= */

.main{
  width:min(1200px,100%);

  margin:auto;

  padding:28px 5% 80px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
  min-height:500px;

  display:grid;
  place-items:center;

  text-align:center;

  color:#087a4b;

  font-weight:800;
  font-size:17px;
}

.spinner{
  width:42px;
  height:42px;

  margin:0 auto 15px;

  border:4px solid #d9eee4;

  border-top-color:#087a4b;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================================================
   COURSE HERO
========================================================= */

.course-hero{

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #e7f8ef,
      #ffffff
    );

  border:1px solid #ccebdd;

  border-radius:28px;

  padding:38px;

  margin-bottom:22px;

  box-shadow:
    0 15px 40px rgba(8,122,75,.07);
}

.course-hero:after{

  content:"";

  position:absolute;

  width:260px;
  height:260px;

  right:-90px;
  top:-110px;

  border-radius:50%;

  background:#d5f3e4;

  opacity:.75;
}

.eyebrow{

  color:#087a4b;

  font-size:11px;

  font-weight:900;

  letter-spacing:3px;
}

.course-title{

  position:relative;

  z-index:2;

  margin:14px 0 10px;

  color:#173b2d;

  font-size:
    clamp(34px,6vw,58px);

  line-height:1.05;
}

.course-description{

  position:relative;

  z-index:2;

  max-width:850px;

  color:#657a71;

  font-size:16px;

  line-height:1.7;
}

.course-meta{

  position:relative;

  z-index:2;

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:20px;
}

.course-meta span{

  padding:7px 11px;

  background:#ffffff;

  border:1px solid #d4ebe0;

  border-radius:10px;

  color:#5e756b;

  font-size:12px;

  font-weight:800;
}


/* =========================================================
   STATISTICS
========================================================= */

.stats{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;

  margin-bottom:22px;
}

.stat{

  background:#fff;

  border:1px solid #dceee6;

  border-radius:21px;

  padding:22px;

  box-shadow:
    0 10px 28px rgba(8,122,75,.05);
}

.stat strong{

  display:block;

  color:#087a4b;

  font-size:34px;

  margin-bottom:5px;
}

.stat span{

  color:#71847b;

  font-size:13px;
}


/* =========================================================
   CONTENT LAYOUT
========================================================= */

.content-layout{

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    300px;

  gap:18px;

  align-items:start;
}


/* =========================================================
   CHAPTER SECTION
========================================================= */

.chapter-section{

  background:#fff;

  border:1px solid #dceee6;

  border-radius:24px;

  padding:28px;

  box-shadow:
    0 10px 30px rgba(8,122,75,.05);
}

.section-heading{

  margin-bottom:22px;
}

.section-heading h2{

  margin:7px 0 5px;

  color:#173b2d;

  font-size:30px;
}

.section-heading p{

  margin:0;

  color:#71847b;

  line-height:1.6;
}


/* =========================================================
   CHAPTER
========================================================= */

.chapter{

  border:1px solid #dceee6;

  border-radius:19px;

  margin-bottom:14px;

  overflow:hidden;

  background:#fbfefd;
}

.chapter:last-child{
  margin-bottom:0;
}

.chapter-header{

  width:100%;

  border:0;

  background:#fff;

  padding:20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  text-align:left;

  cursor:pointer;
}

.chapter-header:hover{

  background:#f5fbf8;
}

.chapter-left{

  display:flex;

  align-items:center;

  gap:14px;

  min-width:0;
}

.chapter-number{

  width:45px;
  height:45px;

  flex-shrink:0;

  display:grid;
  place-items:center;

  border-radius:13px;

  background:#e6f7ee;

  color:#087a4b;

  font-weight:900;
}

.chapter-title{

  color:#214638;

  font-size:17px;

  font-weight:900;

  line-height:1.4;
}

.chapter-description{

  margin-top:4px;

  color:#778980;

  font-size:13px;
}

.chapter-arrow{

  color:#087a4b;

  font-size:20px;

  transition:.2s;
}

.chapter.open
.chapter-arrow{

  transform:rotate(180deg);
}


/* =========================================================
   LESSON LIST
========================================================= */

.lesson-list{

  display:none;

  padding:0 15px 15px;

  background:#f8fcfa;
}

.chapter.open
.lesson-list{

  display:block;
}

.lesson{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:15px;

  margin-top:8px;

  background:#fff;

  border:1px solid #dceee6;

  border-radius:14px;

  text-decoration:none;
}

.lesson:hover{

  border-color:#9ed9bb;

  box-shadow:
    0 8px 20px rgba(8,122,75,.07);
}

.lesson-left{

  display:flex;

  align-items:center;

  gap:12px;

  min-width:0;
}

.lesson-icon{

  width:39px;
  height:39px;

  display:grid;
  place-items:center;

  flex-shrink:0;

  border-radius:11px;

  background:#e8f8f0;

  font-size:19px;
}

.lesson-info{

  min-width:0;
}

.lesson-title{

  color:#214638;

  font-weight:800;

  line-height:1.4;
}

.lesson-number{

  margin-top:3px;

  color:#81928a;

  font-size:11px;
}

.lesson-arrow{

  color:#087a4b;

  font-weight:900;
}


/* =========================================================
   RESOURCE LIST
========================================================= */

.resource-list{

  padding:10px 15px 18px;

  background:#f8fcfa;

  border-top:1px solid #dceee6;
}

.resource-heading{

  padding:8px 0;

  color:#087a4b;

  font-size:12px;

  font-weight:900;

  letter-spacing:1px;
}

.resource-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:12px;

  margin-top:7px;

  background:#fff;

  border:1px solid #dceee6;

  border-radius:12px;

  text-decoration:none;
}

.resource-item:hover{

  border-color:#9ed9bb;
}

.resource-item-info{

  min-width:0;
}

.resource-item-title{

  color:#315548;

  font-size:13px;

  font-weight:800;
}

.resource-item-type{

  margin-top:3px;

  color:#7b8c84;

  font-size:10px;
}

.resource-open{

  flex-shrink:0;

  padding:8px 11px;

  border-radius:9px;

  background:#087a4b;

  color:#fff;

  font-size:11px;

  font-weight:800;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

  position:sticky;

  top:95px;

  display:flex;

  flex-direction:column;

  gap:15px;
}

.sidebar-card{

  background:#fff;

  border:1px solid #dceee6;

  border-radius:22px;

  padding:23px;

  box-shadow:
    0 10px 28px rgba(8,122,75,.05);
}

.sidebar-card h3{

  margin:7px 0 14px;

  color:#173b2d;

  font-size:21px;
}

.sidebar-info{

  color:#70837b;

  font-size:13px;

  line-height:1.7;
}

.sidebar-button{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  padding:11px;

  margin-top:14px;

  border-radius:11px;

  background:#087a4b;

  color:#fff;

  text-decoration:none;

  font-weight:800;

  border:0;

  cursor:pointer;
}

.sidebar-button:hover{

  background:#06683f;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

  padding:40px 20px;

  text-align:center;

  background:#f7fcfa;

  border:1px dashed #bfded0;

  border-radius:17px;

  color:#73877e;

  line-height:1.6;
}


/* =========================================================
   ERROR
========================================================= */

.error{

  max-width:650px;

  margin:70px auto;

  padding:30px;

  text-align:center;

  background:#fff;

  border:1px solid #f0cccc;

  border-radius:20px;

  color:#a92727;
}

.error button{

  margin-top:15px;

  padding:11px 18px;

  border:0;

  border-radius:10px;

  background:#087a4b;

  color:#fff;

  font-weight:800;

  cursor:pointer;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  padding:30px 5%;

  text-align:center;

  background:#fff;

  border-top:1px solid #dceee6;

  color:#70837b;

  font-size:14px;
}

.footer b{
  color:#087a4b;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .stats{

    grid-template-columns:
      repeat(2,1fr);

  }

  .content-layout{

    grid-template-columns:1fr;

  }

  .sidebar{

    position:static;

  }

}

@media(max-width:650px){

  .header{

    padding:10px 4%;

    flex-wrap:wrap;

  }

  .header-actions{

    width:100%;

  }

  .main{

    padding:
      20px 4% 60px;

  }

  .course-hero{

    padding:27px;

    border-radius:23px;

  }

  .chapter-section{

    padding:20px;

  }

  .stats{

    gap:9px;

  }

  .stat{

    padding:17px;

  }

  .stat strong{

    font-size:28px;

  }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

  <div class="brand">

    <div class="brand-mark">
      AG
    </div>

    <div>

      <div class="brand-name">
        AGULIBRARY
      </div>

      <div class="brand-subtitle">
        GLOBAL DIGITAL EDUCATION
      </div>

    </div>

  </div>


  <div class="header-actions">

    <a
      href="student.html"
      class="header-button">

      ← Back to Library

    </a>

  </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">

  <div id="pageContent">

    <div class="loading">

      <div>

        <div class="spinner"></div>

        Loading course...

      </div>

    </div>

  </div>

</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="footer">

  <b>AGULIBRARY</b>

  — Global Digital Education Library

  <br><br>

  Owner: Umar Mohammed

  <br>

  © <span id="year"></span>
  AGULIBRARY. All rights reserved.

</footer>



<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>


<script>

let client = null;

let currentCourse = null;

let chapters = [];

let lessons = [];

let resources = [];


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  startCoursePage
);


async function startCoursePage(){

  document.getElementById(
    "year"
  ).textContent =
    new Date().getFullYear();


  try{

    if(
      typeof getSupabase !== "function"
    ){

      showError(
        "Supabase connection is unavailable."
      );

      return;

    }


    client =
      getSupabase();


    if(
      !client ||
      !client.auth
    ){

      showError(
        "Supabase authentication is unavailable."
      );

      return;

    }


    const sessionResult =
      await client.auth.getSession();


    if(sessionResult.error){

      showError(
        "Unable to verify your account."
      );

      return;

    }


    const session =
      sessionResult.data?.session;


    if(!session){

      window.location.href =
        "auth.html";

      return;

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const courseId =
      params.get("id");


    if(!courseId){

      showError(
        "No course was selected."
      );

      return;

    }


    await loadCourse(
      courseId
    );

  }catch(error){

    console.error(
      "Course page error:",
      error
    );

    showError(
      "Something went wrong while loading this course."
    );

  }

}


/* =========================================================
   LOAD COURSE
========================================================= */

async function loadCourse(courseId){

  const {
    data,
    error
  } =
    await client
      .from("courses")
      .select("*")
      .eq("id", courseId)
      .maybeSingle();


  if(error){

    console.error(
      "Course error:",
      error
    );

    showError(
      "The course could not be loaded."
    );

    return;

  }


  if(!data){

    showError(
      "This course does not exist."
    );

    return;

  }


  currentCourse =
    data;


  document.title =
    (
      data.name ||
      "Course"
    ) +
    " — AGULIBRARY";


  await Promise.all([
    loadChapters(courseId),
    loadLessons(courseId),
    loadResources(courseId)
  ]);


  renderCourse();

}


/* =========================================================
   LOAD CHAPTERS
========================================================= */

async function loadChapters(courseId){

  const {
    data,
    error
  } =
    await client
      .from("chapters")
      .select("*")
      .eq("course_id", courseId)
      .order(
        "chapter_number",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Chapters error:",
      error
    );

    chapters = [];

    return;

  }


  chapters =
    data || [];

}


/* =========================================================
   LOAD LESSONS
========================================================= */

async function loadLessons(courseId){

  /*
    The lessons table belongs to courses
    in the existing AGULIBRARY structure.

    We first try course_id directly.
  */

  let result =
    await client
      .from("lessons")
      .select("*")
      .eq("course_id", courseId)
      .order(
        "lesson_number",
        {
          ascending:true
        }
      );


  /*
    If lesson_number does not exist,
    retry without ordering.
  */

  if(result.error){

    result =
      await client
        .from("lessons")
        .select("*")
        .eq("course_id", courseId);

  }


  if(result.error){

    console.warn(
      "Lessons could not be loaded:",
      result.error
    );

    lessons = [];

    return;

  }


  lessons =
    result.data || [];

}


/* =========================================================
   LOAD RESOURCES
========================================================= */

async function loadResources(courseId){

  const {
    data,
    error
  } =
    await client
      .from("resources")
      .select("*")
      .eq("course_id", courseId)
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.warn(
      "Resources could not be loaded:",
      error
    );

    resources = [];

    return;

  }


  resources =
    data || [];

}


/* =========================================================
   RENDER COURSE
========================================================= */

function renderCourse(){

  const container =
    document.getElementById(
      "pageContent"
    );


  const name =
    currentCourse.name ||
    "Untitled Course";


  const description =
    currentCourse.description ||
    "Explore this AGULIBRARY course and continue your learning journey.";


  const subject =
    currentCourse.subject ||
    currentCourse.subject_name ||
    "";


  const level =
    currentCourse.level ||
    currentCourse.class_level ||
    "";


  const term =
    currentCourse.term ||
    "";


  const meta = [];


  if(subject){
    meta.push(subject);
  }


  if(level){
    meta.push(level);
  }


  if(term){
    meta.push(term);
  }


  container.innerHTML = `

    <section class="course-hero">

      <span class="eyebrow">
        AGULIBRARY COURSE
      </span>


      <h1 class="course-title">

        ${escapeHTML(name)}

      </h1>


      <p class="course-description">

        ${escapeHTML(description)}

      </p>


      ${
        meta.length
          ? `
            <div class="course-meta">

              ${meta
                .map(
                  item =>
                    `<span>${escapeHTML(item)}</span>`
                )
                .join("")}

            </div>
          `
          : ""
      }

    </section>


    <section class="stats">

      <div class="stat">

        <strong>
          ${chapters.length}
        </strong>

        <span>
          Chapters
        </span>

      </div>


      <div class="stat">

        <strong>
          ${lessons.length}
        </strong>

        <span>
          Lessons
        </span>

      </div>


      <div class="stat">

        <strong>
          ${resources.length}
        </strong>

        <span>
          Resources
        </span>

      </div>


      <div class="stat">

        <strong>
          ${getCompletedCount()}%
        </strong>

        <span>
          Learning Progress
        </span>

      </div>

    </section>


    <div class="content-layout">


      <section class="chapter-section">

        <div class="section-heading">

          <span class="eyebrow">
            COURSE CONTENT
          </span>

          <h2>
            Chapters & Lessons
          </h2>

          <p>
            Open a chapter to view its lessons
            and connected learning resources.
          </p>

        </div>


        <div id="chapterList">

          ${renderChapters()}

        </div>

      </section>


      <aside class="sidebar">


        <div class="sidebar-card">

          <span class="eyebrow">
            COURSE OVERVIEW
          </span>

          <h3>
            ${escapeHTML(name)}
          </h3>

          <div class="sidebar-info">

            ${chapters.length}
            chapters

            <br>

            ${lessons.length}
            lessons

            <br>

            ${resources.length}
            learning resources

          </div>


          <button
            class="sidebar-button"
            onclick="openFirstLesson()">

            ▶ Start Learning

          </button>

        </div>


        <div class="sidebar-card">

          <span class="eyebrow">
            AGULIBRARY
          </span>

          <h3>
            Keep Learning
          </h3>

          <div class="sidebar-info">

            Study lessons, open educational
            resources and continue building
            your knowledge.

          </div>

          <a
            href="student.html"
            class="sidebar-button">

            📚 Browse Library

          </a>

        </div>


      </aside>


    </div>

  `;


  setupChapterButtons();

}


/* =========================================================
   RENDER CHAPTERS
========================================================= */

function renderChapters(){

  if(!chapters.length){

    return `

      <div class="empty">

        📚

        <br><br>

        No chapters have been added
        to this course yet.

      </div>

    `;

  }


  return chapters
    .map(
      (chapter,index) => {

        const chapterLessons =
          lessons.filter(
            lesson =>
              String(
                lesson.chapter_id || ""
              ) ===
              String(
                chapter.id
              )
          );


        const chapterResources =
          resources.filter(
            resource =>
              String(
                resource.chapter_id || ""
              ) ===
              String(
                chapter.id
              )
          );


        return `

          <article
            class="chapter"
            data-chapter-id="${escapeAttr(
              chapter.id
            )}">


            <button
              class="chapter-header"
              type="button">


              <div class="chapter-left">

                <div class="chapter-number">

                  ${escapeHTML(
                    chapter.chapter_number ||
                    index + 1
                  )}

                </div>


                <div>

                  <div class="chapter-title">

                    ${escapeHTML(
                      chapter.title ||
                      "Untitled Chapter"
                    )}

                  </div>


                  ${
                    chapter.description
                      ? `
                        <div
                          class="chapter-description">

                          ${escapeHTML(
                            chapter.description
                          )}

                        </div>
                      `
                      : ""
                  }

                </div>

              </div>


              <div class="chapter-arrow">

                ▼

              </div>


            </button>


            <div class="lesson-list">

              ${
                chapterLessons.length
                  ? chapterLessons
                      .map(
                        lesson =>
                          createLessonHTML(
                            lesson
                          )
                      )
                      .join("")
                  : `
                    <div class="empty">

                      No lessons have been
                      added to this chapter yet.

                    </div>
                  `
              }


              ${
                chapterResources.length
                  ? `
                    <div class="resource-list">

                      <div class="resource-heading">

                        CONNECTED RESOURCES

                      </div>

                      ${chapterResources
                        .map(
                          resource =>
                            createResourceHTML(
                              resource
                            )
                        )
                        .join("")}

                    </div>
                  `
                  : ""
              }

            </div>


          </article>

        `;

      }
    )
    .join("");

}


/* =========================================================
   LESSON HTML
========================================================= */

function createLessonHTML(lesson){

  const title =
    lesson.title ||
    lesson.name ||
    "Untitled Lesson";


  const number =
    lesson.lesson_number ||
    lesson.number ||
    "";


  return `

    <a
      class="lesson"
      href="lesson.html?id=${encodeURIComponent(
        lesson.id
      )}">


      <div class="lesson-left">

        <div class="lesson-icon">

          📖

        </div>


        <div class="lesson-info">

          <div class="lesson-title">

            ${escapeHTML(title)}

          </div>


          ${
            number
              ? `
                <div class="lesson-number">

                  Lesson
                  ${escapeHTML(number)}

                </div>
              `
              : ""
          }

        </div>

      </div>


      <div class="lesson-arrow">

        →

      </div>


    </a>

  `;

}


/* =========================================================
   RESOURCE HTML
========================================================= */

function createResourceHTML(resource){

  const title =
    resource.title ||
    "Untitled Resource";


  const type =
    String(
      resource.type ||
      "resource"
    )
    .toUpperCase();


  return `

    <a
      class="resource-item"
      href="resource-viewer.html?id=${encodeURIComponent(
        resource.id
      )}">


      <div class="resource-item-info">

        <div class="resource-item-title">

          ${escapeHTML(title)}

        </div>


        <div class="resource-item-type">

          ${escapeHTML(type)}

        </div>

      </div>


      <span class="resource-open">

        Open

      </span>


    </a>

  `;

}


/* =========================================================
   CHAPTER BUTTONS
========================================================= */

function setupChapterButtons(){

  document
    .querySelectorAll(
      ".chapter-header"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const chapter =
              button.closest(
                ".chapter"
              );


            if(!chapter){

              return;

            }


            chapter.classList.toggle(
              "open"
            );

          }
        );

      }
    );

}


/* =========================================================
   START FIRST LESSON
========================================================= */

function openFirstLesson(){

  if(!lessons.length){

    alert(
      "No lesson is available in this course yet."
    );

    return;

  }


  window.location.href =
    "lesson.html?id=" +
    encodeURIComponent(
      lessons[0].id
    );

}

    "pageContent"
  ).innerHTML = `

    <div class="error">

      ⚠️

      <h2>
        AGULIBRARY
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>


      <button
        onclick="window.location.href='student.html'">

        ← Return to Library

      </button>

    </div>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => {

      const entities = {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      };


      return entities[
        character
      ];

    }
  );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(value){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}
