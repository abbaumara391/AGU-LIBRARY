<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGULIBRARY Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="index.html"><b>AGULIBRARY</b><small>ADMIN PANEL</small></a></header>
<main class="admin"><h1>AGULIBRARY Admin</h1><p>Upload a book, PDF, video or photo to the <b>agu-library</b> bucket.</p><div id="status">Checking connection...</div>
<form id="uploadForm"><label>Title<input id="title" required></label><label>Description<textarea id="description"></textarea></label>
<label>Type<select id="type"><option>book</option><option>pdf</option><option>video</option><option>photo</option><option>course</option><option>lesson</option></select></label>
<label>Subject<input id="subject" placeholder="Physics"></label><label>Level<input id="level" placeholder="Secondary"></label>
<label>Class / Course<input id="classLevel" placeholder="SSS 1"></label><label>File<input id="file" type="file" required></label>
<label><input id="premium" type="checkbox"> Premium</label><button class="btn" type="submit">☁️ Upload & Publish</button></form><p id="result"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="admin.js"></script>
</body></html>
