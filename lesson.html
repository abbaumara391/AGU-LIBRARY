<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>AGULIBRARY — Lesson Reader</title>

<link rel="stylesheet" href="style.css">

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#171918;
  color:#e8f3ee;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.reader-header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:90px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  padding:14px 5%;

  background:#202120;
  border-bottom:1px solid #46504b;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;

  text-decoration:none;
  color:#fff;
}

.brand-mark{
  width:55px;
  height:55px;

  display:grid;
  place-items:center;

  border-radius:17px;

  background:#004d16;

  font-size:21px;
  font-weight:900;
}

.brand b{
  display:block;
  font-size:20px;
}

.brand small{
  display:block;
  margin-top:4px;
  color:#9ca9a4;
  font-size:9px;
  letter-spacing:2px;
}

.header-actions{
  display:flex;
  gap:9px;
  align-items:center;
}

.header-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:11px 15px;

  border:1px solid #555b58;
  border-radius:12px;

  background:#292b2a;
  color:#70e7bc;

  text-decoration:none;
  font-weight:800;
}

.reader{
  width:min(1000px,92%);
  margin:auto;
  padding:35px 0 80px;
}

.message{
  display:none;

  padding:14px 18px;
  margin-bottom:20px;

  border-radius:14px;

  font-weight:800;
}

.message.show{
  display:block;
}

.message.success{
  background:#073c25;
  color:#73e8bd;
}

.message.error{
  background:#421d1d;
  color:#ff9d9d;
}

.lesson-top{
  background:
    linear-gradient(
      135deg,
      #003d17,
      #005a25
    );

  border:1px solid #176b40;

  border-radius:30px;

  padding:38px;

  margin-bottom:22px;
}

.eyebrow{
  color:#70e7bc;

  font-size:11px;

  font-weight:900;

  letter-spacing:3px;
}

.lesson-top h1{
  margin:14px 0 12px;

  font-size:
    clamp(32px,6vw,54px);

  line-height:1.05;

  color:#effff8;
}

.lesson-top p{
  margin:0;

  max-width:760px;

  color:#c4d8cf;

  line-height:1.7;

  font-size:17px;
}

.lesson-meta{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-top:22px;
}

.meta{
  padding:8px 12px;

  border-radius:20px;

  background:rgba(255,255,255,.09);

  color:#dff8ec;

  font-size:12px;

  font-weight:800;
}

.progress-card{
  background:#202120;

  border:1px solid #4b5550;

  border-radius:22px;

  padding:22px;

  margin-bottom:22px;
}

.progress-line{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:15px;

  color:#a9b7b1;

  font-size:13px;

  font-weight:900;
}

.progress-line strong{
  color:#70e7bc;

  font-size:18px;
}

.progress-bar{
  height:14px;

  margin-top:13px;

  background:#10271d;

  border-radius:50px;

  overflow:hidden;
}

.progress-fill{
  width:0;
  height:100%;

  background:#087a4b;

  border-radius:50px;

  transition:
    width .5s ease;
}

.lesson-content{
  background:#202120;

  border:1px solid #4b5550;

  border-radius:28px;

  padding:
    clamp(24px,5vw,48px);

  min-height:450px;
}

.lesson-content h2{
  margin-top:0;

  color:#70e7bc;

  font-size:30px;
}

.lesson-content h3{
  margin-top:30px;

  color:#eaf5f1;

  font-size:23px;
}

.lesson-content p{
  color:#c5d2cc;

  font-size:17px;

  line-height:1.9;
}

.lesson-content ul,
.lesson-content ol{
  color:#c5d2cc;

  line-height:1.9;

  padding-left:26px;
}

.lesson-content li{
  margin-bottom:8px;
}

.lesson-content img,
.lesson-content video,
.lesson-content iframe{
  display:block;

  max-width:100%;

  border-radius:16px;

  margin:18px auto;
}

.lesson-content a{
  color:#70e7bc;
}

.lesson-content blockquote{
  margin:25px 0;

  padding:18px 20px;

  border-left:4px solid #087a4b;

  background:#18221e;

  border-radius:10px;

  color:#c8d8d1;
}

.lesson-file{
  margin-top:30px;

  padding:22px;

  background:#18221e;

  border:1px solid #365044;

  border-radius:18px;
}

.lesson-file a{
  display:inline-block;

  margin-top:12px;

  padding:12px 17px;

  background:#087a4b;

  color:#fff;

  border-radius:12px;

  text-decoration:none;

  font-weight:900;
}

.complete-card{
  margin-top:22px;

  padding:28px;

  text-align:center;

  background:#202120;

  border:1px solid #4b5550;

  border-radius:24px;
}

.complete-card h3{
  margin-top:0;

  color:#eaf5f1;

  font-size:24px;
}

.complete-card p{
  color:#a9b7b1;

  line-height:1.6;
}

.complete-button{
  border:0;

  padding:14px 25px;

  border-radius:13px;

  background:#087a4b;

  color:#fff;

  font-size:15px;

  font-weight:900;

  cursor:pointer;
}

.complete-button:hover{
  background:#09915a;
}

.complete-button.completed{
  background:#075c3b;

  color:#70e7bc;

  cursor:pointer;
}

.navigation{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:15px;

  margin-top:22px;
}

.nav-card{
  min-height:90px;

  padding:20px;

  border:1px solid #4b5550;

  border-radius:20px;

  background:#202120;

  color:#eaf5f1;

  text-align:left;

  cursor:pointer;
}

.nav-card:hover{
  border-color:#70e7bc;
}

.nav-card:disabled{
  opacity:.45;

  cursor:not-allowed;
}

.nav-card small{
  display:block;

  margin-bottom:7px;

  color:#70e7bc;

  font-weight:900;
}

.nav-card strong{
  display:block;

  line-height:1.4;
}

.loading{
  padding:70px 20px;

  text-align:center;

  color:#70e7bc;

  font-weight:800;
}

.empty{
  padding:70px 20px;

  text-align:center;

  color:#9eaba5;

  line-height:1.7;
}

@media(max-width:600px){

  .reader-header{
    min-height:75px;
  }

  .brand-mark{
    width:45px;
    height:45px;

    font-size:18px;
  }

  .brand b{
    font-size:17px;
  }

  .brand small{
    font-size:7px;
  }

  .header-btn{
    padding:9px 11px;

    font-size:12px;
  }

  .reader{
    width:90%;

    padding-top:25px;
  }

  .lesson-top{
    padding:28px;
  }

  .lesson-content{
    padding:25px;
  }

  .lesson-content p{
    font-size:16px;
  }

  .navigation{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="reader-header">

<a
  class="brand"
  href="student.html">

  <div class="brand-mark">
    AG
  </div>

  <div>

    <b>
      AGULIBRARY
    </b>

    <small>
      LESSON READER
    </small>

  </div>

</a>


<div class="header-actions">

<a
  class="header-btn"
  href="student.html">

  ← Dashboard

</a>

</div>

</header>


<main class="reader">


<div
  id="message"
  class="message">
</div>


<section class="lesson-top">

<span class="eyebrow">
AGULIBRARY LESSON
</span>


<h1 id="lessonTitle">
Loading lesson...
</h1>


<p id="lessonDescription">
Please wait while the lesson is loading.
</p>


<div
  id="lessonMeta"
  class="lesson-meta">
</div>

</section>


<section class="progress-card">

<div class="progress-line">

<span>
LESSON PROGRESS
</span>

<strong id="progressPercent">
0%
</strong>

</div>


<div class="progress-bar">

<div
  id="progressFill"
  class="progress-fill">
</div>

</div>

</section>


<section
  id="lessonContent"
  class="lesson-content">

<div class="loading">
Loading lesson content...
</div>

</section>


<section class="complete-card">

<h3>
🎓 Learning Progress
</h3>

<p id="completionMessage">
Study this lesson and mark it as completed
when you finish.
</p>


<button
  id="completeButton"
  class="complete-button">

  ✓ Mark Lesson as Completed

</button>

</section>


<section class="navigation">


<button
  id="previousButton"
  class="nav-card"
  type="button"
  disabled>

  <small>
    ← PREVIOUS LESSON
  </small>

  <strong id="previousTitle">
    No previous lesson
  </strong>

</button>


<button
  id="nextButton"
  class="nav-card"
  type="button"
  disabled>

  <small>
    NEXT LESSON →
  </small>

  <strong id="nextTitle">
    No next lesson
  </strong>

</button>


</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const client =
  typeof getSupabase === "function"
    ? getSupabase()
    : null;


let currentUser = null;

let currentLesson = null;

let lessons = [];

let completedLessons = [];


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  message,
  type = "success"
){

  const box =
    document.getElementById(
      "message"
    );

  if(!box)return;

  box.textContent =
    message;

  box.className =
    "message show " +
    type;

  setTimeout(
    ()=>{
      box.classList.remove(
        "show"
      );
    },
    3500
  );

}


/* =========================================================
   URL LESSON ID
========================================================= */

function getLessonId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("lesson") ||
    params.get("resource")
  );

}


/* =========================================================
   LOGIN
========================================================= */

async function checkStudent(){

  if(!client){

    showMessage(
      "Supabase connection is not available.",
      "error"
    );

    return null;
  }


  try{

    const {
      data,
      error
    } =
      await client.auth.getSession();


    if(
      error ||
      !data ||
      !data.session
    ){

      window.location.href =
        "auth.html";

      return null;

    }


    return data.session.user;

  }catch(error){

    console.error(
      error
    );

    showMessage(
      "Unable to check your account.",
      "error"
    );

    return null;

  }

}


/* =========================================================
   COMPLETION STORAGE
========================================================= */

function completedStorageKey(){

  if(!currentUser){

    return "AGU_COMPLETED_GUEST";

  }


  return (
    "AGU_COMPLETED_" +
    currentUser.id
  );

}


function getCompletedLessons(){

  try{

    return JSON.parse(
      localStorage.getItem(
        completedStorageKey()
      ) || "[]"
    );

  }catch(error){

    console.error(
      error
    );

    return [];

  }

}


function setCompletedLessons(list){

  try{

    localStorage.setItem(
      completedStorageKey(),
      JSON.stringify(list)
    );

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================================================
   IS COMPLETED
========================================================= */

function isLessonCompleted(id){

  return completedLessons.some(
    item =>
      String(item) ===
      String(id)
  );

}


/* =========================================================
   MARK COMPLETED
========================================================= */

async function markLessonCompleted(){

  if(
    !currentUser ||
    !currentLesson
  ){

    return;

  }


  const id =
    String(
      currentLesson.id
    );


  if(
    !isLessonCompleted(id)
  ){

    completedLessons.push(
      id
    );

    setCompletedLessons(
      completedLessons
    );

  }


  updateCompletionUI();

  updateOverallProgress();

  showMessage(
    "🎉 Lesson completed! Your learning progress has been updated."
  );


  /*
    Try to save completion in Supabase
    if a table named student_completed_lessons
    exists.
  */

  try{

    const {
      error
    } =
      await client
        .from(
          "student_completed_lessons"
        )
        .upsert(
          {
            user_id:
              currentUser.id,

            resource_id:
              Number(
                currentLesson.id
              )
          },
          {
            onConflict:
              "user_id,resource_id"
          }
        );


    if(error){

      console.warn(
        "Supabase completion backup:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Completion backup unavailable:",
      error
    );

  }

}


/* =========================================================
   COMPLETION UI
========================================================= */

function updateCompletionUI(){

  if(!currentLesson){

    return;

  }


  const completed =
    isLessonCompleted(
      currentLesson.id
    );


  const button =
    document.getElementById(
      "completeButton"
    );


  const message =
    document.getElementById(
      "completionMessage"
    );


  const percent =
    document.getElementById(
      "progressPercent"
    );


  const fill =
    document.getElementById(
      "progressFill"
    );


  if(completed){

    button.textContent =
      "✓ Lesson Completed";

    button.classList.add(
      "completed"
    );


    message.textContent =
      "Excellent! You have completed this lesson. You can continue to the next lesson.";


    percent.textContent =
      "100%";


    fill.style.width =
      "100%";

  }else{

    button.textContent =
      "✓ Mark Lesson as Completed";

    button.classList.remove(
      "completed"
    );


    message.textContent =
      "Study this lesson and mark it as completed when you finish.";


    percent.textContent =
      "0%";


    fill.style.width =
      "0%";

  }

}


/* =========================================================
   LOAD LESSON
========================================================= */

async function loadLesson(){

  currentUser =
    await checkStudent();


  if(!currentUser){

    return;

  }


  completedLessons =
    getCompletedLessons();


  const lessonId =
    getLessonId();


  if(!lessonId){

    document.getElementById(
      "lessonTitle"
    ).textContent =
      "No Lesson Selected";


    document.getElementById(
      "lessonDescription"
    ).textContent =
      "Please return to the Student Dashboard and select a lesson.";


    document.getElementById(
      "lessonContent"
    ).innerHTML = `

      <div class="empty">

        No lesson ID was provided.

        <br><br>

        Return to your Student Dashboard
        and select a lesson.

      </div>

    `;

    return;

  }


  const {
    data,
    error
  } =
    await client
      .from("resources")
      .select("*")
      .eq(
        "id",
        lessonId
      )
      .maybeSingle();


  if(error){

    console.error(
      error
    );


    showMessage(
      "Unable to load this lesson.",
      "error"
    );

    return;

  }


  if(!data){

    document.getElementBy
