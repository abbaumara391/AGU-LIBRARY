<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AGULIBRARY — Student Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3faf7;
      color: #10231d;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #dce8e3;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #087f52;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
    }

    .brand h1 {
      font-size: 25px;
    }

    .brand p {
      color: #718079;
      margin-top: 3px;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .website-btn {
      text-decoration: none;
      color: #087f52;
      border: 1px solid #d6e4de;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 700;
      background: white;
    }

    main {
      width: 100%;
      max-width: 620px;
      margin: 55px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border: 1px solid #dce8e3;
      border-radius: 28px;
      padding: 38px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.05);
    }

    .eyebrow {
      color: #087f52;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 44px;
      line-height: 1.05;
      margin-bottom: 15px;
    }

    .intro {
      color: #6d7c76;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .tabs {
      display: flex;
      background: #f0f6f3;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #60716a;
      cursor: pointer;
    }

    .tab.active {
      background: white;
      color: #087f52;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d5e2dd;
      border-radius: 13px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #087f52;
      box-shadow: 0 0 0 3px rgba(8,127,82,0.10);
    }

    .primary {
      width: 100%;
      margin-top: 25px;
      border: 0;
      background: #087f52;
      color: white;
      padding: 17px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: 0.6;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.5;
      font-weight: 600;
    }

    .success {
      display: block;
      background: #e8f8f0;
      color: #087f52;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .small {
      text-align: center;
      color: #74827c;
      margin-top: 22px;
      line-height: 1.5;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      color: #84918c;
      padding: 25px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 14px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .brand p {
        font-size: 10px;
      }

      .logo {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }

      .website-btn {
        padding: 11px 13px;
        font-size: 13px;
      }

      main {
        margin: 30px auto;
      }

      .card {
        padding: 25px 20px;
        border-radius: 22px;
      }

      h2 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">AG</div>
    <div>
      <h1>AGULIBRARY</h1>
      <p>LEARN • READ • WATCH • GROW</p>
    </div>
  </div>

  <a class="website-btn" href="./index.html">
    ← Website
  </a>
</header>

<main>

  <section class="card">

    <div class="eyebrow">STUDENT ACCOUNT</div>

    <h2 id="title">Welcome to AGULIBRARY</h2>

    <p class="intro" id="intro">
      Create your free student account and begin learning with AGULIBRARY.
    </p>

    <div class="tabs">
      <button class="tab active" id="registerTab">
        Create Account
      </button>

      <button class="tab" id="loginTab">
        Sign In
      </button>
    </div>

    <!-- REGISTER -->

    <form id="registerForm">

      <label for="fullName">Full name</label>

      <input
        id="fullName"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="registerEmail">Email address</label>

      <input
        id="registerEmail"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="registerPassword">Password</label>

      <input
        id="registerPassword"
        type="password"
        placeholder="Create a password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm password</label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Repeat your password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button class="primary" type="submit" id="registerButton">
        Create Student Account
      </button>

    </form>

    <!-- LOGIN -->

    <form id="loginForm" class="hidden">

      <label for="loginEmail">Email address</label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="loginPassword">Password</label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button class="primary" type="submit" id="loginButton">
        Sign In to AGULIBRARY
      </button>

    </form>

    <div id="message" class="message"></div>

    <p class="small">
      By creating an account, you agree to use AGULIBRARY
      responsibly for educational purposes.
    </p>

  </section>

</main>

<footer>
  © AGULIBRARY — Learn • Read • Watch • Grow
</footer>


<script>

  // ==========================================
  // AGULIBRARY PHASE 3
  // STUDENT AUTHENTICATION
  // ==========================================

  const config = window.AGU_CONFIG;

  if (!config || !config.supabaseUrl || !config.supabaseAnonKey) {

    showMessage(
      "Supabase configuration was not found. Please check config.js.",
      "error"
    );

    throw new Error("AGU_CONFIG is missing.");

  }

  const supabaseClient = window.supabase.createClient(
    config.supabaseUrl,
    config.supabaseAnonKey
  );


  // ==========================================
  // ELEMENTS
  // ==========================================

  const registerTab = document.getElementById("registerTab");
  const loginTab = document.getElementById("loginTab");

  const registerForm = document.getElementById("registerForm");
  const loginForm = document.getElementById("loginForm");

  const title = document.getElementById("title");
  const intro = document.getElementById("intro");

  const message = document.getElementById("message");


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

  }


  function clearMessage() {

    message.textContent = "";

    message.className = "message";

  }


  // ==========================================
  // TABS
  // ==========================================

  registerTab.addEventListener("click", () => {

    clearMessage();

    registerTab.classList.add("active");

    loginTab.classList.remove("active");

    registerForm.classList.remove("hidden");

    loginForm.classList.add("hidden");

    title.textContent = "Welcome to AGULIBRARY";

    intro.textContent =
      "Create your free student account and begin learning with AGULIBRARY.";

  });


  loginTab.addEventListener("click", () => {

    clearMessage();

    loginTab.classList.add("active");

    registerTab.classList.remove("active");

    loginForm.classList.remove("hidden");

    registerForm.classList.add("hidden");

    title.textContent = "Welcome Back";

    intro.textContent =
      "Sign in to continue your learning journey with AGULIBRARY.";

  });


  // ==========================================
  // STUDENT REGISTRATION
  // ==========================================

  registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();

    const button =
      document.getElementById("registerButton");

    const fullName =
      document.getElementById("fullName").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;

    }


    button.disabled = true;

    button.textContent = "Creating account...";


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: fullName,
              role: "student"
            },

            emailRedirectTo:
              window.location.origin + "/auth.html"

          }

        });


      if (error) {

        throw error;

      }


      showMessage(
        "Account created successfully! Please check your email and confirm your email address before signing in.",
        "success"
      );


      registerForm.reset();


    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Unable to create your account.",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Create Student Account";

    }

  });


  // ==========================================
  // STUDENT LOGIN
  // ==========================================

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();

    const button =
      document.getElementById("loginButton");

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    button.disabled = true;

    button.textContent = "Signing in...";


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        throw error;

      }


      showMessage(
        "Login successful. Opening your AGULIBRARY account...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "./index.html";

      }, 1200);


    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Unable to sign in.",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Sign In to AGULIBRARY";

    }

  });


  // ==========================================
  // CHECK EXISTING SESSION
  // ==========================================

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data && data.session) {

      showMessage(
        "You are already signed in. You can return to AGULIBRARY.",
        "success"
      );

    }

  }


  checkSession();

</script>

</body>
</html>
