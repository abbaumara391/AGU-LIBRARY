<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>AGULIBRARY Admin</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="nav">

  <a
    class="brand"
    href="index.html"
  >

    <span class="mark">
      AG
    </span>

    <span>

      <b>
        AGULIBRARY
      </b>

      <small>
        SECURE ADMIN
      </small>

    </span>

  </a>


  <a
    class="btn outline"
    href="index.html"
  >
    ← Website
  </a>

</header>



<main class="admin">


  <!-- =========================
       ADMIN LOGIN
  ========================== -->

  <section
    id="loginPanel"
    class="panel"
  >

    <span class="eyebrow">
      SECURE ADMINISTRATION
    </span>


    <h1>
      AGULIBRARY Admin
    </h1>


    <p class="muted">
      Sign in with the administrator
      account you created in Supabase.
    </p>


    <form id="loginForm">


      <label>

        Email

        <input
          id="email"
          type="email"
          required
          autocomplete="email"
          placeholder="Admin email"
        >

      </label>



      <label>

        Password

        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="Admin password"
        >

      </label>



      <button
        class="btn primary wide"
        type="submit"
      >

        🔐 Sign in to Admin

      </button>


    </form>


    <p id="loginMessage"></p>


  </section>



  <!-- =========================
       ADMIN DASHBOARD
  ========================== -->

  <section
    id="dashboardPanel"
    class="panel hidden"
  >


    <div class="dash">


      <div>

        <span class="eyebrow">
          ADMIN DASHBOARD
        </span>


        <h1>
          Content Manager
        </h1>

      </div>


      <button
        id="logoutBtn"
        class="btn outline"
        type="button"
      >

        Sign out

      </button>


    </div>



    <p id="adminMessage"></p>



    <!-- =========================
         UPLOAD FORM
    ========================== -->

    <form id="uploadForm">


      <label>

        Resource title

        <input
          id="title"
          type="text"
          required
          placeholder="Example: Mastery Physics SSS1"
        >

      </label>



      <label>

        Description

        <textarea
          id="description"
          placeholder="Write a short description of the resource"
        ></textarea>

      </label>



      <div class="two">


        <label>

          Type

          <select id="type">

            <option value="book">
              Book
            </option>

            <option value="pdf">
              PDF
            </option>

            <option value="video">
              Video
            </option>

            <option value="photo">
              Photo
            </option>

            <option value="course">
              Course
            </option>

            <option value="lesson">
              Lesson
            </option>

          </select>

        </label>



        <label>

          Subject

          <input
            id="subject"
            type="text"
            placeholder="Example: Physics"
          >

        </label>


      </div>



      <div class="two">


        <label>

          Level

          <input
            id="level"
            type="text"
            placeholder="Primary / Secondary / University"
          >

        </label>



        <label>

          Class / Course

          <input
            id="classLevel"
            type="text"
            placeholder="SSS 1 / Grade 8 / Year 1"
          >

        </label>


      </div>



      <label>

        Term / Semester

        <input
          id="term"
          type="text"
          placeholder="First Term / Semester 1"
        >

      </label>



      <label>

        Educational file

        <input
          id="file"
          type="file"
          required
        >

      </label>



      <label>

        <input
          id="premium"
          type="checkbox"
        >

        Premium resource

      </label>



      <button
        class="btn primary wide"
        type="submit"
      >

        ☁️ Upload & Publish

      </button>


    </form>



    <div class="admin-info">


      <b>
        AGULIBRARY Storage
      </b>

      <br>

      Bucket:
      <strong>
        agu-library
      </strong>


      <br><br>


      <b>
        Database
      </b>

      <br>

      Table:
      <strong>
        resources
      </strong>


      <br><br>


      <b>
        Access
      </b>

      <br>

      Administrator only 🔐


    </div>


  </section>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>

<script src="admin.js"></script>


</body>

</html>
