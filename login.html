<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AGU Education — Login</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <!-- =========================
       LOGIN HEADER
  ========================== -->

  <header class="site-header">

    <div class="brand">

      <div class="brand-logo">
        AGU
      </div>

      <div>
        <h1>AGU EDUCATIONAL PLATFORM</h1>
        <p>Learn • Teach • Grow</p>
      </div>

    </div>

  </header>


  <!-- =========================
       LOGIN PAGE
  ========================== -->

  <main class="auth-page">

    <div class="auth-card">

      <div class="auth-icon">
        🔐
      </div>

      <h2>Welcome Back</h2>

      <p class="auth-subtitle">
        Login to your AGU Educational account.
      </p>


      <!-- =========================
           LOGIN FORM
      ========================== -->

      <form id="loginForm">

        <div class="form-group">

          <label for="loginEmail">
            Email Address
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
          >

        </div>


        <button
          type="submit"
          class="auth-btn"
        >
          🔐 Login
        </button>

      </form>


      <div id="loginMessage" class="auth-message"></div>


      <!-- =========================
           REGISTER
      ========================== -->

      <div class="auth-divider">
        <span>OR</span>
      </div>


      <p class="register-text">
        Don't have an account?
      </p>


      <button
        type="button"
        class="register-btn"
        onclick="showRegister()"
      >
        ✨ Create Account
      </button>


      <!-- =========================
           REGISTER FORM
      ========================== -->

      <form
        id="registerForm"
        style="display:none;"
      >

        <h3>Create Your Account</h3>


        <div class="form-group">

          <label for="registerName">
            Full Name
          </label>

          <input
            type="text"
            id="registerName"
            placeholder="Enter your full name"
            required
          >

        </div>


        <div class="form-group">

          <label for="registerEmail">
            Email Address
          </label>

          <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
            required
          >

        </div>


        <div class="form-group">

          <label for="registerPassword">
            Password
          </label>

          <input
            type="password"
            id="registerPassword"
            placeholder="Create a password"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label for="registerRole">
            Account Type
          </label>

          <select
            id="registerRole"
            required
          >

            <option value="">
              Select account type
            </option>

            <option value="student">
              👨‍🎓 Student
            </option>

            <option value="teacher">
              👨‍🏫 Teacher
            </option>

          </select>

        </div>


<div class="form-group">

  <label for="invitationCode">
    📩 Invitation Code
  </label>

  <input
    type="text"
    id="invitationCode"
    placeholder="Enter invitation code"
    maxlength="7"
    autocomplete="off"
  >

  <small>
    Enter the invitation code you received.
  </small>

</div>        <button
          type="submit"
          class="auth-btn"
        >
          ✨ Create Account
        </button>

      </form>


      <div
        id="registerMessage"
        class="auth-message"
      ></div>


      <!-- =========================
           BACK TO PLATFORM
      ========================== -->

      <a
        href="index.html"
        class="back-link"
      >
        ← Back to AGU Educational Platform
      </a>

    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="data.js"></script>
  <script src="auth.js"></script>

</body>

</html>
